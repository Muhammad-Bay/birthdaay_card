<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Birthday Card</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #111 0%, #000 100%);
      overflow: hidden;
      font-family: Arial, sans-serif;
    }
    h1 {
      position: absolute;
      top: 5%;
      width: 100%;
      text-align: center;
      font-size: 2rem;
      color: #fff;
      text-shadow: 0 0 10px #ff0, 0 0 20px #f0f, 0 0 30px #0ff;
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 5px #fff; }
      to { text-shadow: 0 0 20px #ff0, 0 0 30px #f0f, 0 0 40px #0ff; }
    }
    .cake {
      position: relative;
      width: 200px;
      height: 150px;
      background: #ff69b4;
      border-radius: 0 0 20px 20px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    .candle {
      position: absolute;
      width: 10px;
      height: 40px;
      background: #fff;
      left: 50%;
      transform: translateX(-50%);
      top: -40px;
      border-radius: 3px;
    }
    .flame {
      position: absolute;
      width: 15px;
      height: 15px;
      background: radial-gradient(circle, #ff0 0%, #f00 70%);
      border-radius: 50%;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      animation: flicker 0.2s infinite;
    }
    @keyframes flicker {
      0% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.2); }
      100% { transform: translateX(-50%) scale(1); }
    }
    .smoke {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(200,200,200,0.5);
      top: -50px;
      left: 50%;
      transform: translateX(-50%);
      animation: rise 3s infinite;
    }
    @keyframes rise {
      0% { opacity: 0.5; transform: translate(-50%, 0) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -100px) scale(3); }
    }
    .light {
      position: absolute;
      width: 5px;
      height: 5px;
      background: #fff;
      border-radius: 50%;
      animation: twinkle 2s infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Accept the Post Birthday Greetings from The best "Mian Saab lol" 🎉</h1>
  <div class="cake">
    <div class="candle">
      <div class="flame"></div>
      <div class="smoke"></div>
    </div>
  </div>

  <audio autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-happyrock.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Generate random lights
    for (let i = 0; i < 30; i++) {
      const light = document.createElement('div');
      light.classList.add('light');
      light.style.top = Math.random() * window.innerHeight + 'px';
      light.style.left = Math.random() * window.innerWidth + 'px';
      light.style.animationDuration = (1 + Math.random()*3) + 's';
      document.body.appendChild(light);
    }
  </script>
</body>
</html>
