<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Happy Birthday 🎉</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Accept the Post Birthday Greetings from The best "Mian Saab lol"</h1>

  <!-- Cake container -->
  <div class="cake" id="cake">
    <div class="candles">
      <div class="candle">
        <div class="flame"></div>
        <div class="smoke"></div>
      </div>
      <div class="candle">
        <div class="flame"></div>
        <div class="smoke"></div>
      </div>
      <div class="candle">
        <div class="flame"></div>
        <div class="smoke"></div>
      </div>
    </div>
  </div>

  <!-- Control buttons -->
  <div class="controls">
    <button id="blowBtn">Blow Candles 🎂</button>
    <button id="hideBtn">Hide Cake 🙈</button>
  </div>

  <!-- Background music -->
  <audio id="music" autoplay loop controls>
    <source src="https://www2.cs.uic.edu/~i101/SoundFiles/HappyBirthday.mid" type="audio/midi">
    Your browser does not support the audio tag.
  </audio>

  <!-- Lights animation -->
  <div class="lights"></div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
