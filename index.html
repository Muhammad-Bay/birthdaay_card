<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birthday Surprise</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: black;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }
    #welcome, #greetings, #candles, #final {
      display: none;
      margin-top: 100px;
    }
    button {
      padding: 10px 20px;
      font-size: 18px;
      margin-top: 20px;
      cursor: pointer;
      border-radius: 10px;
      border: none;
      background: #ff4081;
      color: white;
    }
    .emoji {
      font-size: 80px;
      margin-top: 20px;
    }
    .cake {
      font-size: 100px;
      margin-top: 20px;
    }
    .popper {
      position: absolute;
      font-size: 40px;
      animation: fall 3s linear infinite;
    }
    @keyframes fall {
      from { transform: translateY(-100px); }
      to { transform: translateY(100vh); }
    }
    #background-text {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 60px;
      color: white;
      opacity: 0.1;
      z-index: -1;
    }
  </style>
</head>
<body>

  <div id="welcome">
    <h1>Message from Muhammad</h1>
    <p>(Click anywhere to accept)</p>
  </div>

  <div id="greetings">
    <h2>Accept Post Birthday Greetings From Miaan Saab</h2>
    <button onclick="showCandles()">Accept</button>
    <div class="emoji">🫂 🎉</div>
  </div>

  <div id="candles">
    <div class="cake">🎂🕯️🕯️🕯️</div>
    <button onclick="blowCandles()">Blow the Candles</button>
  </div>

  <div id="final">
    <h1>Happy Birthday mery Kaaly toty 🎉</h1>
    <audio id="music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" autoplay loop></audio>
    <div id="background-text">Happy Birthday Shahzad</div>
  </div>

  <script>
    const welcome = document.getElementById('welcome');
    const greetings = document.getElementById('greetings');
    const candles = document.getElementById('candles');
    const final = document.getElementById('final');

    window.onload = () => {
      welcome.style.display = 'block';
      document.body.addEventListener('click', showGreetings, { once: true });
    }

    function showGreetings() {
      welcome.style.display = 'none';
      greetings.style.display = 'block';
    }

    function showCandles() {
      greetings.style.display = 'none';
      candles.style.display = 'block';
    }

    function blowCandles() {
      candles.style.display = 'none';
      final.style.display = 'block';
      launchPoppers();
      document.getElementById('music').play();
    }

    function launchPoppers() {
      for (let i = 0; i < 30; i++) {
        let popper = document.createElement('div');
        popper.innerHTML = '🎊';
        popper.classList.add('popper');
        popper.style.left = Math.random() * 100 + 'vw';
        popper.style.animationDuration = (Math.random() * 2 + 2) + 's';
        document.body.appendChild(popper);
        setTimeout(() => popper.remove(), 3000);
      }
    }
  </script>

</body>
</html>
