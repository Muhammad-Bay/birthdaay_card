<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Surprise</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      text-align: center;
      background: black;
      color: white;
      overflow: hidden;
    }

    .screen {
      display: none;
      height: 100vh;
      width: 100%;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .active {
      display: flex;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      background: #ff4081;
      color: white;
      cursor: pointer;
    }

    .emoji {
      font-size: 80px;
      margin: 20px;
      animation: bounce 1.5s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .cake {
      font-size: 100px;
      margin: 20px;
    }

    .candles {
      font-size: 40px;
      color: yellow;
    }

    .party {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .message-bg {
      font-size: 50px;
      color: rgba(255,255,255,0.1);
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: -1;
      white-space: nowrap;
      animation: float 5s infinite linear;
    }

    @keyframes float {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Screen 1 -->
  <div id="screen1" class="screen active" onclick="nextScreen(2)">
    <h1>Message from Muhammad</h1>
    <p>(Click anywhere to accept)</p>
  </div>

  <!-- Screen 2 -->
  <div id="screen2" class="screen">
    <h1>Accept Post Birthday Greetings From Miaan Saab</h1>
    <button onclick="nextScreen(3)">Accept</button>
  </div>

  <!-- Screen 3 -->
  <div id="screen3" class="screen">
    <div class="emoji">🧑‍❤️‍💋‍🧑</div>
    <div class="cake">🎂</div>
    <div class="candles" id="candles">🕯🕯🕯🕯🕯</div>
    <button onclick="blowCandles()">Blow the Candles</button>
  </div>

  <!-- Screen 4 -->
  <div id="screen4" class="screen">
    <h1>Happy Birthday mery Kaaly toty 🎉</h1>
    <div class="message-bg">Happy Birthday Shahzad</div>
    <canvas id="confetti" class="party"></canvas>
    <audio id="music" loop>
      <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script>
    function nextScreen(num) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen' + num).classList.add('active');
    }

    function blowCandles() {
      document.getElementById("candles").innerHTML = "💨";
      setTimeout(() => {
        nextScreen(4);
        document.getElementById("music").play();
        startConfetti();
      }, 1000);
    }

    // 🎉 Simple Confetti Effect
    const canvas = document.getElementById('confetti');
    const ctx = canvas.getContext('2d');
    let confetti = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function startConfetti() {
      for (let i = 0; i < 200; i++) {
        confetti.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height - canvas.height,
          r: Math.random() * 6 + 4,
          d: Math.random() * 20 + 10,
          color: "hsl(" + Math.random() * 360 + ",100%,50%)",
          tilt: Math.floor(Math.random() * 10) - 10
        });
      }
      requestAnimationFrame(drawConfetti);
    }

    function drawConfetti() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < confetti.length; i++) {
        let c = confetti[i];
        ctx.beginPath();
        ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2, false);
        ctx.fillStyle = c.color;
        ctx.fill();
        c.y += Math.cos(c.d) + 1 + c.r / 2;
        c.x += Math.sin(c.d);
        if (c.y > canvas.height) {
          c.x = Math.random() * canvas.width;
          c.y = -10;
        }
      }
      requestAnimationFrame(drawConfetti);
    }
  </script>

</body>
</html>
