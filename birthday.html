<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Birthday Message</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.7.77/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }
        .font-pacifico {
            font-family: 'Pacifico', cursive;
        }
        .screen {
            transition: opacity 0.7s ease-in-out;
        }
        .hidden {
            display: none;
        }
        .animate-pop-in {
            animation: popIn 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Heart Picker Animation */
        .heart-picker {
            transform: translateX(-150%);
            animation: slideIn 1.5s forwards;
            animation-delay: 0.5s;
        }
        @keyframes slideIn {
            0% { transform: translateX(-150%); }
            100% { transform: translateX(0); }
        }

        /* Cake Animation */
        .cake-container {
            opacity: 0;
            transform: translateY(50px);
            animation: riseUp 1s forwards;
            animation-delay: 1.8s;
        }
        @keyframes riseUp {
             0% { opacity: 0; transform: translateY(50px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Candle Flame */
        .flame {
            width: 12px;
            height: 25px;
            background-color: #ffac33;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            position: absolute;
            top: -24px;
            left: 50%;
            transform: translateX(-50%);
            animation: flicker 1s infinite;
            transform-origin: bottom;
            transition: all 0.3s ease;
        }
        .flame.out {
            transform: scale(0) rotate(180deg);
            opacity: 0;
        }
        @keyframes flicker {
            0%, 100% { transform: translateX(-50%) scaleY(1) rotate(2deg); }
            50% { transform: translateX(-50%) scaleY(1.05) rotate(-2deg); }
        }

        /* Party Poppers */
        .popper {
            position: absolute;
            width: 10px;
            height: 10px;
            background: red;
            border-radius: 50%;
            opacity: 0;
            animation: pop 1s ease-out forwards;
        }
        @keyframes pop {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0); opacity: 0; }
        }
        
        .smoke {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            filter: blur(10px);
            opacity: 0;
            animation: smoke-drift 4s ease-out forwards;
        }

        @keyframes smoke-drift {
            0% { transform: scale(0.5); opacity: 0; }
            25% { transform: scale(1); opacity: 0.7; }
            100% { transform: scale(2) translateY(-100px); opacity: 0; }
        }

        .bg-text {
            position: absolute;
            font-size: 15vw;
            color: rgba(255, 255, 255, 0.05);
            font-weight: bold;
            text-transform: uppercase;
            z-index: -1;
            white-space: nowrap;
        }
    </style>
</head>
<body class="bg-gray-900 text-white overflow-hidden">

    <!-- Screen 1: Initial Message -->
    <div id="screen1" class="screen fixed inset-0 flex items-center justify-center bg-gray-900 cursor-pointer p-4">
        <div class="text-center animate-pop-in">
            <h1 class="text-3xl md:text-5xl font-pacifico text-cyan-400">Message from Muhammad</h1>
            <p class="mt-4 text-lg md:text-xl text-gray-300">(Click anywhere to accept)</p>
        </div>
    </div>

    <!-- Screen 2: Accept Greetings -->
    <div id="screen2" class="screen fixed inset-0 flex-col items-center justify-center bg-gray-900 hidden p-4">
        <div class="text-center animate-pop-in">
            <h2 class="text-2xl md:text-4xl font-semibold">Accept Post Birthday Greetings</h2>
            <h1 class="text-4xl md:text-6xl font-pacifico text-amber-400 my-4">From Miaan Saab</h1>
            <button id="acceptBtn" class="mt-6 px-8 py-3 bg-green-500 text-white font-bold rounded-full shadow-lg hover:bg-green-600 transform hover:scale-105 transition-transform duration-300">
                Accept
            </button>
        </div>
    </div>

    <!-- Screen 3: Cake and Candles -->
    <div id="screen3" class="screen fixed inset-0 flex-col items-center justify-center bg-gray-900 hidden p-4">
        <!-- Heart Picker Emoji -->
        <div class="absolute top-10 left-10 w-24 h-24 heart-picker">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50 87.3C40.3 77.8 15 60.3 15 40.3 15 26.3 26.3 15 40.3 15c8.3 0 15.8 4 20.3 10.3l.3.4.3-.4C65.8 19 73.3 15 81.7 15c14 0 25.3 11.3 25.3 25.3 0 20-25.3 37.5-35 47z" fill="#ff4d4d"/>
                <circle cx="35" cy="50" r="25" fill="#fdd835"/>
                <circle cx="30" cy="45" r="3" fill="#000"/>
                <circle cx="40" cy="45" r="3" fill="#000"/>
                <path d="M30 55 C 32 60, 38 60, 40 55" stroke="#000" stroke-width="2" fill="none"/>
            </svg>
        </div>
        
        <div class="cake-container text-center relative">
            <!-- Cake -->
            <div class="relative w-64 h-48">
                <!-- Icing -->
                <div class="absolute bottom-32 w-full h-8 bg-pink-300 rounded-t-xl"></div>
                <!-- Cake Layer -->
                <div class="absolute bottom-0 w-full h-32 bg-yellow-200 rounded-xl shadow-2xl"></div>
                <!-- Candles -->
                <div class="absolute top-0 left-1/2 -translate-x-1/2 flex space-x-4">
                    <div class="relative w-3 h-12 bg-blue-400 rounded-t-sm"><div class="flame"></div></div>
                    <div class="relative w-3 h-12 bg-red-400 rounded-t-sm"><div class="flame"></div></div>
                    <div class="relative w-3 h-12 bg-green-400 rounded-t-sm"><div class="flame"></div></div>
                </div>
            </div>
            <button id="blowCandlesBtn" class="mt-12 px-8 py-3 bg-cyan-500 text-white font-bold rounded-full shadow-lg hover:bg-cyan-600 transform hover:scale-105 transition-transform duration-300">
                Blow the Candles
            </button>
        </div>
    </div>
    
    <!-- Screen 4: Final Message -->
    <div id="screen4" class="screen fixed inset-0 flex-col items-center justify-center bg-black hidden p-4 overflow-hidden">
        <div class="bg-text font-pacifico">Happy Birthday Shahzad</div>
        <div id="popper-container" class="absolute inset-0"></div>
         <div id="smoke-container" class="absolute inset-0"></div>

        <div class="text-center animate-pop-in z-10">
            <h1 class="text-5xl md:text-8xl font-pacifico text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-500 to-red-500">
                Happy Birthday
            </h1>
            <p class="text-3xl md:text-5xl mt-4 text-yellow-300 font-semibold">Mery Kaaly Toty</p>
        </div>
    </div>


    <script>
        const screen1 = document.getElementById('screen1');
        const screen2 = document.getElementById('screen2');
        const screen3 = document.getElementById('screen3');
        const screen4 = document.getElementById('screen4');

        const acceptBtn = document.getElementById('acceptBtn');
        const blowCandlesBtn = document.getElementById('blowCandlesBtn');
        const flames = document.querySelectorAll('.flame');
        const popperContainer = document.getElementById('popper-container');
        const smokeContainer = document.getElementById('smoke-container');

        // Transition from Screen 1 to 2
        screen1.addEventListener('click', () => {
            screen1.style.opacity = '0';
            setTimeout(() => {
                screen1.classList.add('hidden');
                screen2.classList.remove('hidden');
                screen2.style.opacity = '1';
            }, 700);
        });

        // Transition from Screen 2 to 3
        acceptBtn.addEventListener('click', () => {
            screen2.style.opacity = '0';
            setTimeout(() => {
                screen2.classList.add('hidden');
                screen3.classList.remove('hidden');
                screen3.style.opacity = '1';
            }, 700);
        });

        // Transition from Screen 3 to 4
        blowCandlesBtn.addEventListener('click', () => {
            flames.forEach(flame => flame.classList.add('out'));
            
            setTimeout(() => {
                screen3.style.opacity = '0';
                setTimeout(() => {
                    screen3.classList.add('hidden');
                    screen4.classList.remove('hidden');
                    screen4.style.opacity = '1';
                    triggerCelebration();
                }, 700);
            }, 500);
        });

        function triggerCelebration() {
            // Start Music
            playBirthdayMusic();

            // Create Poppers
            for (let i = 0; i < 50; i++) {
                createPopper();
            }
             // Create Smoke
            for (let i = 0; i < 10; i++) {
                createSmoke();
            }
        }
        
        function createPopper() {
            const popper = document.createElement('div');
            popper.classList.add('popper');
            const colors = ['#ff4d4d', '#ffac33', '#33ff57', '#3357ff', '#ff33a8', '#ffff33'];
            popper.style.background = colors[Math.floor(Math.random() * colors.length)];

            const startX = window.innerWidth / 2;
            const startY = window.innerHeight;

            popper.style.left = `${startX}px`;
            popper.style.top = `${startY}px`;

            const angle = Math.random() * Math.PI * 2 - Math.PI / 2;
            const velocity = Math.random() * 400 + 400;
            const endX = Math.cos(angle) * velocity;
            const endY = Math.sin(angle) * velocity - 300;
            
            popper.style.setProperty('--x', `${endX}px`);
            popper.style.setProperty('--y', `${endY}px`);

            popperContainer.appendChild(popper);
            
            setTimeout(() => {
                popper.remove();
            }, 1000);
        }

        function createSmoke() {
            const smoke = document.createElement('div');
            smoke.classList.add('smoke');
            const size = Math.random() * 150 + 100;
            smoke.style.width = `${size}px`;
            smoke.style.height = `${size}px`;
            smoke.style.left = `${Math.random() * 100}%`;
            smoke.style.bottom = `-50px`;
            smoke.style.animationDelay = `${Math.random() * 2}s`;
            smokeContainer.appendChild(smoke);
            setTimeout(() => {
                smoke.remove();
            }, 4000);
        }

        function playBirthdayMusic() {
            // Ensure audio context is started by user gesture
            Tone.start();

            // Create a synth and connect it to the main output (your speakers)
            const synth = new Tone.PolySynth(Tone.Synth, {
                oscillator: { type: "sine" },
                envelope: {
                    attack: 0.005,
                    decay: 0.1,
                    sustain: 0.3,
                    release: 1,
                },
            }).toDestination();
            
            const bass = new Tone.MonoSynth({
                oscillator : {
                    type : "fmsquare",
                    modulationType : "sawtooth",
                    modulationIndex: 3,
                    harmonicity: 3.4
                },
                envelope : {
                    attack : 0.001,
                    decay : 0.1,
                    sustain: 0.1,
                    release: 0.1
                }
            }).toDestination();

            // Define the melody
            const melody = [
                { time: '0:0', note: 'C4', duration: '8n' }, { time: '0:0:2', note: 'C4', duration: '8n' },
                { time: '0:1', note: 'D4', duration: '4n' }, { time: '0:2', note: 'C4', duration: '4n' },
                { time: '0:3', note: 'F4', duration: '4n' }, { time: '1:0', note: 'E4', duration: '2n' },
                { time: '1:2', note: 'C4', duration: '8n' }, { time: '1:2:2', note: 'C4', duration: '8n' },
                { time: '1:3', note: 'D4', duration: '4n' }, { time: '2:0', note: 'C4', duration: '4n' },
                { time: '2:1', note: 'G4', duration: '4n' }, { time: '2:2', note: 'F4', duration: '2n' },
                { time: '3:0', note: 'C4', duration: '8n' }, { time: '3:0:2', note: 'C4', duration: '8n' },
                { time: '3:1', note: 'C5', duration: '4n' }, { time: '3:2', note: 'A4', duration: '4n' },
                { time: '3:3', note: 'F4', duration: '4n' }, { time: '4:0', note: 'E4', duration: '4n' },
                { time: '4:1', note: 'D4', duration: '2n' }, { time: '4:3', note: 'Bb4', duration: '8n' },
                { time: '4:3:2', note: 'Bb4', duration: '8n' }, { time: '5:0', note: 'A4', duration: '4n' },
                { time: '5:1', note: 'F4', duration: '4n' }, { time: '5:2', note: 'G4', duration: '4n' },
                { time: '5:3', note: 'F4', duration: '2n' }
            ];

            const bassLine = [
                { time: '0:0', note: 'C2', duration: '2n'},
                { time: '0:2', note: 'G2', duration: '2n'},
                { time: '1:0', note: 'F2', duration: '2n'},
                { time: '1:2', note: 'C2', duration: '2n'},
                 { time: '2:0', note: 'G2', duration: '2n'},
                { time: '2:2', note: 'C2', duration: '2n'},
            ];
            
            const melodyPart = new Tone.Part((time, value) => {
                synth.triggerAttackRelease(value.note, value.duration, time);
            }, melody).start(0);

            const bassPart = new Tone.Part((time, value) => {
                bass.triggerAttackRelease(value.note, value.duration, time);
            }, bassLine).start(0);

            melodyPart.loop = true;
            melodyPart.loopEnd = '6m';
            bassPart.loop = true;
            bassPart.loopEnd = '3m';

            // Start the transport (the master clock)
            Tone.Transport.bpm.value = 140;
            Tone.Transport.start();
        }
    </script>
</body>
</html>
